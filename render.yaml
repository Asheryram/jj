# Render blueprint for the API and its database.
#
# Committed so the deploy is reproducible rather than a set of settings somebody
# typed into a dashboard once. Render is one option among several — Railway or
# Fly.io would work the same way — but the API needs a host that keeps a process
# running, and this file records what that host has to provide.
#
# The front end is not here. It goes to Vercel as a static build; see
# frontend/DEPLOY.md.

services:
  - type: web
    name: jdc-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Never the free plan for this service. A free instance sleeps when idle, and
    # this API is not idle when nobody is clicking: the reconciler sweeps every
    # 60 seconds for payments whose webhook never arrived, and orders are
    # dispatched on a timer after the payment confirms. Asleep, a customer is
    # charged and the bundle is never ordered.
    plan: starter
    healthCheckPath: /api/health
    region: frankfurt # nearest to Ghana of the available regions
    envVars:
      - key: NODE_ENV
        value: production
      # The Neon connection string. A secret, and deliberately not wired to a
      # Render-managed database: the database is its own service at another
      # provider, so the only thing shared between them is this string.
      #
      # This is Neon's POOLED connection string (the one with `-pooler` in
      # the hostname) — what the running app uses for everyday queries.
      - key: DATABASE_URL
        sync: false
      # Neon's DIRECT (un-pooled) connection string — same host, minus
      # `-pooler`, from the same "Connection details" panel in Neon. Used
      # only by `prisma migrate deploy` in the release command: a pooled
      # PgBouncer connection cannot reliably hold the advisory lock Migrate
      # takes to stop two deploys racing, and running deploy through it
      # times out waiting to acquire a lock it can never actually see itself
      # holding — see the comment on `datasource db` in schema.prisma.
      - key: DIRECT_URL
        sync: false

      # ── Set these in the dashboard; they are secrets or they are per-deploy ──
      # sync: false means Render prompts rather than storing a value in git.
      - key: JWT_SECRET
        sync: false # 32+ characters, or the app refuses to boot
      - key: SUPERADMIN_EMAIL
        sync: false # who gets the first setup link
      - key: PUBLIC_APP_URL
        sync: false # the Vercel domain — where Paystack returns customers
      - key: CORS_ORIGINS
        sync: false # the Vercel domain, exactly
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: DATAHUB_API_KEY
        sync: false
      - key: DATAHUB_BASE_URL
        sync: false # must end in /api — see supplier/datahub.client.ts
      - key: DATAHUB_LIVE
        sync: false
      - key: DATAHUB_WEBHOOK_SECRET
        sync: false
      # Mail goes through Resend first, SMTP as the fallback if Resend fails or
      # is not configured — see MailerService for why both exist. Set whichever
      # you actually have; `configured` only requires one of them.
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Powers the " Assistant " assistant (agent, admin, superadmin). A free
      # key from console.groq.com/keys works — no card, no daily cap the way
      # some other providers' free tiers have. Left unset, the feature
      # degrades to "not set up yet" rather than erroring.
      - key: GROQ_API_KEY
        sync: false

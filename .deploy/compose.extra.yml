# Extra sidecar: a dedicated Postgres for the analytics warehouse.
# ANALYTICS_DATABASE_URL in the api's runtime env must point here:
#   postgresql://analytics:analytics@analytics-db:5432/analytics_warehouse
#
# This container is private to each environment's network — prod, staging,
# develop and every preview each get their own isolated analytics DB.
services:
  analytics-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics_warehouse
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  analytics-db-data:
